plugins {
    id 'com.android.application'
}

android {
    namespace 'com.treadmill.relay'
    compileSdk 34

    defaultConfig {
        applicationId "com.treadmill.relay"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便 adb install -r 覆盖
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
