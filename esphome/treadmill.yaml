# ============================================================================
# 跑步机 BLE 网关 —— ESP32-S3 + ESPHome
#
# 硬件: ESP32-S3-DevKitC-1 (N16R8: 16MB Flash + 8MB PSRAM)
# 目标: 让 Home Assistant 完全控制跑步机（启动/调速/变坡/停止 + 读实时数据）
#
# 协议来源: 本仓库 docs/01-协议逆向完整记录.md
#   - 标准 FTMS (0x1826)，控制点 0x2AD9
#   - 必须先写解锁码到 d18d2c10-c44c-11e8-a355-529269fb1459
#   - 解锁后等 2 秒，再订阅数据特征值
#
# 用法:
#   1. 填 secrets.yaml（wifi 密码等）
#   2. 填下面 <<< 需要你修改 >>> 的几处
#   3. esphome run treadmill.yaml
# ============================================================================

substitutions:
  # ===== <<< 需要你修改 >>> =====
  treadmill_mac: "AA:BB:CC:DD:EE:FF"        # 你的跑步机 MAC（大小写不敏感）
  unlock_code: "0123456789ABCDEF"           # 解锁码（从 App 数据或二维码获取）

  # 设备名（会出现在 HA 里）
  device_name: "balcony-treadmill"

  # ===== 可选：OLED 引脚（如果你买的板子带 1.3" OLED）=====
  # 常见接线: SDA=GPIO8, SCL=GPIO9，也有 GPIO1/GPIO2 的，看你板子丝印
  oled_sda: "GPIO8"
  oled_scl: "GPIO9"

esphome:
  name: ${device_name}
  friendly_name: "阳台跑步机"
  # 解锁后需要 2 秒等待，用 on_boot 做初始化
  on_boot:
    priority: -100
    then:
      - delay: 10s      # 等 WiFi + BLE 栈就绪
      - lambda: |-
          ESP_LOGI("treadmill", "系统启动完成，等待 BLE 连接");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # BLE + WiFi 共存需要
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# 网络
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 断网时开热点，方便现场调试
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  logs:
    esp32_ble_tracker: WARN
    ble_client: DEBUG
    component: WARN

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ===========================================================================
# BLE 部分
# ===========================================================================
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 160ms
    active: true

ble_client:
  - mac_address: ${treadmill_mac}
    id: tm
    # 连接后自动发现服务
    on_connect:
      then:
        - logger.log: "跑步机已连接"
        - lambda: |-
            id(tm_connected) = true;
            // 解锁流程：连接后 1 秒写解锁码
            id(unlock_pending) = true;
    on_disconnect:
      then:
        - logger.log: "跑步机断开"
        - lambda: |-
            id(tm_connected) = false;

# ---------------------------------------------------------------------------
# 全局状态变量
# ---------------------------------------------------------------------------
globals:
  - id: tm_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: unlock_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: tm_speed_kmh
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: tm_incline_pct
    type: float
    restore_value: false
    initial_value: "0.0"

# ===========================================================================
# 控制指令（写 FTMS 控制点 0x2AD9）
# ===========================================================================
button:
  # ---- 解锁（关键是第一步！）----
  - platform: template
    name: "跑步机 解锁"
    id: btn_unlock
    icon: mdi:lock-open
    on_press:
      - lambda: |-
          if (!id(tm_connected)) {
            ESP_LOGW("treadmill", "未连接，无法解锁");
            return;
          }
          ESP_LOGI("treadmill", "写解锁码到 d18d2c10-...");
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "d18d2c10-c44c-11e8-a355-529269fb1459"
          value: !lambda |-
            // 把 unlock_code 字符串转成字节数组
            return esphome::ble_client::hex_to_bytes("${unlock_code}");

  # ---- 请求控制权（00）----
  - platform: template
    name: "跑步机 请求控制"
    id: btn_request_control
    icon: mdi:account-key
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x00]

  # ---- 启动（07）----
  - platform: template
    name: "跑步机 启动"
    id: btn_start
    icon: mdi:play
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x07]

  # ---- 暂停（0802）----
  - platform: template
    name: "跑步机 暂停"
    id: btn_pause
    icon: mdi:pause
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x08, 0x02]

  # ---- 停止（0801）----
  - platform: template
    name: "跑步机 停止"
    id: btn_stop
    icon: mdi:stop
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x08, 0x01]

  # ---- 一键启动（解锁+控制+启动）----
  - platform: template
    name: "跑步机 一键启动"
    id: btn_quick_start
    icon: mdi:rocket-launch
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "d18d2c10-c44c-11e8-a355-529269fb1459"
          value: !lambda 'return esphome::ble_client::hex_to_bytes("${unlock_code}");'
      - delay: 2s
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x00]
      - delay: 500ms
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x07]

# ===========================================================================
# 速度 / 坡度（number 实体，可在 HA 滑动调节）
# ===========================================================================
number:
  - platform: template
    name: "跑步机 速度"
    id: num_speed
    icon: mdi:speedometer
    unit_of_measurement: "km/h"
    min_value: 0.5
    max_value: 14.0
    step: 0.1
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          id(tm_speed_kmh) = x;
          ESP_LOGI("treadmill", "设置速度 %.1f km/h", x);
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            // 0x02 + uint16(km/h × 100) 小端
            uint16_t v = (uint16_t)roundf(x * 100.0f);
            return {0x02, (uint8_t)(v & 0xFF), (uint8_t)(v >> 8)};

  - platform: template
    name: "跑步机 坡度"
    id: num_incline
    icon: mdi:slope-uphill
    unit_of_measurement: "%"
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          id(tm_incline_pct) = x;
          ESP_LOGI("treadmill", "设置坡度 %.0f%%", x);
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            // 0x03 + int16(pct × 10) 小端
            int16_t v = (int16_t)roundf(x * 10.0f);
            return {0x03, (uint8_t)(v & 0xFF), (uint8_t)((v >> 8) & 0xFF)};

# ===========================================================================
# 实时数据（订阅 0x2ACD）
# ===========================================================================
sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: tm
    service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "00002acd-0000-1000-8000-00805f9b34fb"
    name: "跑步机 原始数据"
    id: tm_raw
    notify: true
    internal: true
    on_value:
      - lambda: |-
          // 数据帧格式（实测 YPOO M5，其他机型需重新核对）:
          //   9c25 <speed:2> <incline:2> 0000 00ff7f ...
          //         offset 0-1: 帧头 9c25
          //         offset 2-3: 速度 ×100 小端
          //         offset 4-5: 坡度 ×10 小端
          if (x.size() < 6) return;
          uint16_t raw_speed = x[2] | (x[3] << 8);
          uint16_t raw_incline = x[4] | (x[5] << 8);
          float spd = raw_speed / 100.0f;
          float inc = raw_incline / 10.0f;
          if (fabsf(spd - id(tm_speed_kmh)) > 0.01f) {
            ESP_LOGD("treadmill", "速度 %.2f -> %.2f", id(tm_speed_kmh), spd);
            id(tm_speed_kmh) = spd;
            id(sensor_speed).publish_state(spd);
          }
          if (fabsf(inc - id(tm_incline_pct)) > 0.05f) {
            id(tm_incline_pct) = inc;
            id(sensor_incline).publish_state(inc);
          }

  - platform: template
    name: "跑步机 当前速度"
    id: sensor_speed
    icon: mdi:speedometer
    unit_of_measurement: "km/h"
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: "跑步机 当前坡度"
    id: sensor_incline
    icon: mdi:slope-uphill
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never

  # RSSI（信号强度，判断跑步机离 ESP32 多远）
  - platform: ble_client
    type: rssi
    ble_client_id: tm
    name: "跑步机 信号强度"
    icon: mdi:signal

# ===========================================================================
# 连接状态（binary_sensor）
# ===========================================================================
binary_sensor:
  - platform: template
    name: "跑步机 已连接"
    id: sensor_connected
    device_class: connectivity
    lambda: |-
      return id(tm_connected);

# ===========================================================================
# OLED 显示（可选，没有屏幕就注释掉这段）
# ===========================================================================
i2c:
  sda: ${oled_sda}
  scl: ${oled_scl}
  scan: true
  id: bus_i2c

font:
  - file: "gfonts://Roboto"
    id: font_md
    size: 14
  - file: "gfonts://Roboto"
    id: font_lg
    size: 20

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    i2c_id: bus_i2c
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, id(font_md), "Treadmill");
      if (id(tm_connected)) {
        it.printf(0, 16, id(font_lg), "%.1f km/h", id(tm_speed_kmh));
        it.printf(0, 38, id(font_md), "Incline %.0f%%", id(tm_incline_pct));
        it.printf(0, 52, id(font_md), "WiFi %d dBm", (int)WiFi.RSSI());
      } else {
        it.printf(0, 20, id(font_md), "Disconnected");
        it.printf(0, 36, id(font_md), "WiFi %d dBm", (int)WiFi.RSSI());
      }
