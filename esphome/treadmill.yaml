# ============================================================================
# 跑步机 BLE 网关 —— ESP32-S3 + ESPHome
#
# 硬件: ESP32-S3-DevKitC-1 (N16R8: 16MB Flash + 8MB PSRAM)
# 目标: 让 Home Assistant 完全控制跑步机（启动/调速/变坡/停止 + 读实时数据）
#
# 协议来源: 本仓库 docs/01-协议逆向完整记录.md
#   - 标准 FTMS (0x1826)，控制点 0x2AD9
#   - 必须先写解锁码到 d18d2c10-c44c-11e8-a355-529269fb1459
#   - 解锁后等 2 秒，再订阅数据特征值
#
# 用法:
#   1. 填 secrets.yaml（wifi 密码等）
#   2. 填下面 <<< 需要你修改 >>> 的几处
#   3. esphome run treadmill.yaml
# ============================================================================

substitutions:
  # ===== <<< 需要你修改 >>> =====
  treadmill_mac: !secret treadmill_mac        # 你的跑步机 MAC（大小写不敏感）
  unlock_code: !secret unlock_code           # 解锁码（从 App 数据或二维码获取）

  # 设备名（会出现在 HA 里）
  device_name: "balcony-treadmill"

  # ===== 可选：OLED 引脚（如果你买的板子带 1.3" OLED）=====
  # 常见接线: SDA=GPIO8, SCL=GPIO9，也有 GPIO1/GPIO2 的，看你板子丝印
  oled_sda: "GPIO8"
  oled_scl: "GPIO9"

# 把十六进制字符串转成字节数组（ESPHome 2026.x 移除了 ble_client::hex_to_bytes）
# 本地外部组件（跑步机 0x2ACD 原始字节解析）
external_components:
  - source:
      type: local
      path: components
    components: [treadmill]

esphome:
  name: ${device_name}
  friendly_name: "阳台跑步机"
  includes:
    - hex_helper.h
  # 解锁后需要 2 秒等待，用 on_boot 做初始化
  on_boot:
    priority: -100
    then:
      - delay: 10s      # 等 WiFi + BLE 栈就绪
      - lambda: |-
          ESP_LOGI("treadmill", "系统启动完成，等待 BLE 连接");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # BLE + WiFi 共存需要
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# 网络
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 断网时开热点，方便现场调试
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG
  # ESP32-S3 原生 USB 口的日志通道（否则日志走 UART0，USB 口收不到）
  hardware_uart: USB_CDC
  logs:
    esp32_ble_tracker: WARN
    ble_client: DEBUG
    component: WARN
    bluetooth_proxy: DEBUG
    # 自定义组件日志（必须显式声明，否则被 component:WARN 兜底压制）
    treadmill: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ===========================================================================
# BLE 部分
# ===========================================================================
# bluetooth_proxy + ble_client 共用，需要足够连接槽位
esp32_ble:
  max_connections: 6

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 160ms
    active: true

# 暴露 BLE 扫描结果给 API，便于诊断（同时也给 Home Assistant 当蓝牙代理用）
debug:
  update_interval: 60s

bluetooth_proxy:
  active: true

ble_client:
  - mac_address: ${treadmill_mac}
    id: tm
    # 连接后自动完成握手：等待服务发现 -> 写解锁码 -> 等 2 秒 -> 请求控制权
    #
    # 为什么要等：
    #   - 服务发现完成后才能写特征值，所以先 delay
    #   - 写解锁码后跑步机会重置 GATT 会话，必须等 2 秒再发下一条
    on_connect:
      then:
        - logger.log: "跑步机已连接，2 秒后自动解锁"
        - lambda: |-
            id(tm_connected) = true;
        - delay: 2s
        # ---- 1. 写解锁码 ----
        - lambda: |-
            ESP_LOGI("treadmill", "[自动] 写解锁码");
        - ble_client.ble_write:
            id: tm
            service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
            characteristic_uuid: "d18d2c10-c44c-11e8-a355-529269fb1459"
            value: !lambda 'return tm_hex_to_bytes("${unlock_code}");'
        # ---- 2. 等跑步机重置 GATT 会话 ----
        - delay: 2s
        # ---- 3. 请求控制权 ----
        - lambda: |-
            ESP_LOGI("treadmill", "[自动] 请求控制权");
        - ble_client.ble_write:
            id: tm
            service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
            characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
            value: [0x00]
        - delay: 500ms
        - logger.log: "自动握手完成，可以启动跑步机了"
    on_disconnect:
      then:
        - logger.log: "跑步机断开"
        - lambda: |-
            id(tm_connected) = false;

# ---------------------------------------------------------------------------
# 全局状态变量
# ---------------------------------------------------------------------------
globals:
  - id: tm_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: unlock_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: tm_speed_kmh
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: tm_incline_pct
    type: float
    restore_value: false
    initial_value: "0.0"

# ===========================================================================
# 控制指令（写 FTMS 控制点 0x2AD9）
# ===========================================================================
button:
  # ---- 解锁（关键是第一步！）----
  - platform: template
    name: "treadmill_unlock"
    id: btn_unlock
    icon: mdi:lock-open
    on_press:
      - lambda: |-
          if (!id(tm_connected)) {
            ESP_LOGW("treadmill", "未连接，无法解锁");
            return;
          }
          ESP_LOGI("treadmill", "写解锁码到 d18d2c10-...");
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "d18d2c10-c44c-11e8-a355-529269fb1459"
          value: !lambda |-
            // 把 unlock_code 字符串转成字节数组
            return tm_hex_to_bytes("${unlock_code}");

  # ---- 请求控制权（00）----
  - platform: template
    name: "treadmill_request_control"
    id: btn_request_control
    icon: mdi:account-key
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x00]

  # ---- 启动（07）----
  - platform: template
    name: "treadmill_start"
    id: btn_start
    icon: mdi:play
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x07]

  # ---- 暂停（0802）----
  - platform: template
    name: "treadmill_pause"
    id: btn_pause
    icon: mdi:pause
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x08, 0x02]

  # ---- 停止（0801）----
  - platform: template
    name: "treadmill_stop"
    id: btn_stop
    icon: mdi:stop
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x08, 0x01]

  # ---- 一键启动（解锁+控制+启动）----
  - platform: template
    name: "treadmill_quick_start"
    id: btn_quick_start
    icon: mdi:rocket-launch
    on_press:
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "d18d2c10-c44c-11e8-a355-529269fb1459"
          value: !lambda 'return tm_hex_to_bytes("${unlock_code}");'
      - delay: 2s
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x00]
      - delay: 500ms
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: [0x07]

# ===========================================================================
# 速度 / 坡度（number 实体，可在 HA 滑动调节）
# ===========================================================================
number:
  - platform: template
    name: "treadmill_speed"
    id: num_speed
    icon: mdi:speedometer
    unit_of_measurement: "km/h"
    min_value: 0.5
    max_value: 14.0
    step: 0.1
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          id(tm_speed_kmh) = x;
          ESP_LOGI("treadmill", "设置速度 %.1f km/h", x);
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            // 0x02 + uint16(km/h × 100) 小端
            uint16_t v = (uint16_t)roundf(x * 100.0f);
            return {0x02, (uint8_t)(v & 0xFF), (uint8_t)(v >> 8)};

  - platform: template
    name: "treadmill_incline"
    id: num_incline
    icon: mdi:slope-uphill
    unit_of_measurement: "%"
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          id(tm_incline_pct) = x;
          ESP_LOGI("treadmill", "设置坡度 %.0f%%", x);
      - ble_client.ble_write:
          id: tm
          service_uuid: "00001826-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            // 0x03 + int16(pct × 10) 小端
            int16_t v = (int16_t)roundf(x * 10.0f);
            return {0x03, (uint8_t)(v & 0xFF), (uint8_t)((v >> 8) & 0xFF)};

# ===========================================================================
# 实时数据（订阅 0x2ACD）
# ===========================================================================
sensor:
  # 跑步机实时数据（外部组件 components/treadmill，解析 0x2ACD 原始字节）
  - platform: treadmill
    ble_client_id: tm
    speed:
      name: "treadmill_current_speed"
      id: sensor_speed
    incline:
      name: "treadmill_current_incline"
      id: sensor_incline
    distance:
      name: "treadmill_current_distance"
      id: sensor_distance

  # RSSI（信号强度，判断跑步机离 ESP32 多远）
  - platform: ble_client
    type: rssi
    ble_client_id: tm
    name: "treadmill_rssi"
    icon: mdi:signal

  # =========================================================================
  # ESP32 板载状态（诊断用）
  # =========================================================================
  - platform: internal_temperature
    name: "esp32_chip_temp"
    id: esp32_chip_temp
    icon: mdi:thermometer
    accuracy_decimals: 1
    update_interval: 60s

  - platform: debug
    free:
      name: "esp32_free_ram"
      id: esp32_free_ram
    block:
      name: "esp32_max_block"
      id: esp32_max_block
    min_free:
      name: "esp32_min_free_ram"
      id: esp32_min_free_ram
    fragmentation:
      name: "esp32_ram_fragmentation"
      id: esp32_ram_fragmentation
    loop_time:
      name: "esp32_loop_time"
      id: esp32_loop_time
    psram:
      name: "esp32_free_psram"
      id: esp32_free_psram

  - platform: wifi_signal
    name: "esp32_wifi_rssi"
    id: esp32_wifi_rssi
    update_interval: 60s
    accuracy_decimals: 0

  - platform: uptime
    name: "esp32_uptime"
    id: esp32_uptime
    update_interval: 60s

  # 供电电压：需要外接分压电阻才能测（USB 5V --100k-- GPIO1 --100k-- GND）
  # 未接线时读数无意义，所以默认注释掉。接线后取消注释即可。
  # - platform: adc
  #   pin: GPIO1
  #   name: "esp32_supply_voltage"
  #   attenuation: 12db
  #   update_interval: 60s
  #   accuracy_decimals: 2
  #   unit_of_measurement: "V"
  #   filters:
  #     - multiply: 2.0

# ===========================================================================
# 连接状态（binary_sensor）
# ===========================================================================
binary_sensor:
  - platform: template
    name: "treadmill_connected"
    id: sensor_connected
    device_class: connectivity
    lambda: |-
      return id(tm_connected);

# ===========================================================================
# OLED 显示（可选，没有屏幕就注释掉这段）
# ===========================================================================
i2c:
  sda: ${oled_sda}
  scl: ${oled_scl}
  scan: true
  id: bus_i2c

font:
  - file: "gfonts://Roboto"
    id: font_md
    size: 14
  - file: "gfonts://Roboto"
    id: font_lg
    size: 20

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    i2c_id: bus_i2c
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, id(font_md), "Treadmill");
      if (id(tm_connected)) {
        it.printf(0, 16, id(font_lg), "%.1f km/h", id(tm_speed_kmh));
        it.printf(0, 38, id(font_md), "Incline %.0f%%", id(tm_incline_pct));
        it.printf(0, 52, id(font_md), "WiFi %d dBm", (int)wifi::global_wifi_component->wifi_rssi());
      } else {
        it.printf(0, 20, id(font_md), "Disconnected");
        it.printf(0, 36, id(font_md), "WiFi %d dBm", (int)wifi::global_wifi_component->wifi_rssi());
      }

# 临时诊断用 Web 服务（可浏览器看日志）
web_server:
  port: 80
  version: 3
